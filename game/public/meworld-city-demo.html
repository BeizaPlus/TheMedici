<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeWorld City — Interactive Medical RPG Demo</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0f;
  --panel: #12121a;
  --gold: #c9a227;
  --text: #e0e0e0;
  --muted: #888;
  --red: #d44;
  --green: #3a8;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  user-select: none;
}

/* ===== CITY OVERWORLD ===== */
.city-view {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, #1a1a3e 0%, #2a1a3e 40%, #1a1a2e 70%, #0a0a1a 100%);
  overflow: hidden;
}

/* Stars */
.star { position: absolute; background: #fff; border-radius: 50%; opacity: 0.4; animation: twinkle 3s infinite alternate; }
@keyframes twinkle { to { opacity: 0.2; } }

/* Moon */
.moon {
  position: absolute; top: 8%; right: 12%;
  width: 60px; height: 60px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff8dc, #c9a227);
  box-shadow: 0 0 40px rgba(201,162,39,0.3), 0 0 80px rgba(201,162,39,0.1);
}

/* Ground */
.ground {
  position: absolute; bottom: 0; left: 0; right: 0; height: 55%;
  background: linear-gradient(180deg, #1a1a2e, #0e0e1a);
}

/* Road — fills the lower portion with dashed center line */
.road {
  position: absolute; bottom: 0; left: 0; right: 0; height: 40%;
  background: linear-gradient(180deg, #232330, #1a1a26);
}
.road::after {
  content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 2px;
  background: repeating-linear-gradient(90deg, var(--gold) 0, var(--gold) 40px, transparent 40px, transparent 80px);
  opacity: 0.35; transform: translateY(-50%);
}
.road-line { position: absolute; top: 10%; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.05); }
.road-line.bottom { top: auto; bottom: 15%; }
.curb { position: absolute; bottom: 40%; left: 0; right: 0; height: 3px; background: #2a2a38; }

/* Buildings */
.building {
  position: absolute; bottom: 43%;
  background: linear-gradient(180deg, #1e1e30, #151520);
  border: 1px solid #2a2a3e;
}
.building::after {
  content: ''; position: absolute; inset: 0;
  background-image: repeating-linear-gradient(0deg, transparent, transparent 4px, rgba(201,162,39,0.04) 4px, rgba(201,162,39,0.04) 5px),
    repeating-linear-gradient(90deg, transparent, transparent 12px, rgba(201,162,39,0.02) 12px, rgba(201,162,39,0.02) 13px);
}
.window {
  position: absolute; width: 6px; height: 8px;
  background: rgba(201,162,39,0.15); border: 1px solid rgba(201,162,39,0.2);
}
.window.lit { background: rgba(201,162,39,0.4); box-shadow: 0 0 4px rgba(201,162,39,0.3); }

/* Streetlamps */
.streetlamp {
  position: absolute; bottom: 43%;
  width: 3px; height: 30px;
  background: linear-gradient(180deg, #3a3a4a, #2a2a3a);
}
.streetlamp::after {
  content: ''; position: absolute; top: 0; left: 50%;
  transform: translate(-50%, -50%);
  width: 8px; height: 5px;
  background: radial-gradient(ellipse at center, var(--gold), transparent);
  border-radius: 50%;
  box-shadow: 0 0 10px rgba(201,162,39,0.3);
  animation: glow 2s infinite alternate;
}
@keyframes glow { to { box-shadow: 0 0 16px rgba(201,162,39,0.5); } }

/* Hospital sign */
.hospital-sign {
  position: absolute; bottom: 43%; left: 50%;
  transform: translateX(-50%);
  width: 100px; height: 80px;
  background: #1a1a2a;
  border: 1px solid #2a2a4a;
}
.hospital-cross {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  width: 28px; height: 28px;
}
.hospital-cross::before, .hospital-cross::after {
  content: ''; position: absolute; background: #c44;
}
.hospital-cross::before { width: 100%; height: 30%; top: 35%; left: 0; }
.hospital-cross::after { width: 30%; height: 100%; left: 35%; top: 0; }
.hospital-label {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  font-size: 8px; letter-spacing: 0.2em; color: var(--gold);
  text-transform: uppercase; white-space: nowrap;
}

/* NPC — man on the curb */
.npc {
  position: absolute; bottom: 43%; right: 18%;
  width: 14px; height: 22px;
  cursor: pointer; z-index: 5;
}
.npc-body {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 11px; height: 15px; background: #5a5a6a; border-radius: 2px 2px 0 0;
}
.npc-head {
  position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
  width: 9px; height: 9px; background: #6a6a7a; border-radius: 50%;
}
.npc-arm {
  position: absolute; bottom: 8px; right: -4px;
  width: 8px; height: 2px; background: #5a5a6a;
  transform: rotate(-30deg);
}
.npc-indicator {
  position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
  font-size: 10px; color: var(--gold);
  animation: bounce 0.6s infinite alternate;
  display: none;
}
.npc:hover .npc-indicator { display: block; }
@keyframes bounce { to { transform: translateX(-50%) translateY(-3px); } }

/* Ambulance / truck */
.ambulance {
  position: absolute; bottom: 16%; left: -120px;
  width: 100px; height: 40px;
  z-index: 10; cursor: pointer;
  transition: left 4s cubic-bezier(0.25, 0.1, 0.25, 1);
}
.ambulance-body {
  position: absolute; bottom: 10px; left: 0; right: 0;
  height: 26px; background: linear-gradient(180deg, #2a2a3a, #1a1a28);
  border: 2px solid var(--gold);
  border-radius: 3px 3px 2px 2px;
}
.ambulance-body::after {
  content: '+';
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: #c44; font-size: 18px; font-weight: 700;
}
.ambulance-cab {
  position: absolute; bottom: 10px; left: 8px;
  width: 30px; height: 30px;
  background: linear-gradient(180deg, #3a3a5a, #222238);
  border: 2px solid var(--gold);
  border-radius: 4px 0 0 2px;
}
.ambulance-cab::after {
  content: ''; position: absolute; top: 4px; left: 4px; right: 4px; height: 12px;
  background: rgba(201,162,39,0.15); border: 1px solid rgba(201,162,39,0.2); border-radius: 1px;
}
/* Wheels */
.ambulance .wheel {
  position: absolute; bottom: 2px;
  width: 12px; height: 12px;
  background: #111; border: 2px solid #333;
  border-radius: 50%;
  animation: spin 0.5s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.ambulance .wheel.front { right: 16px; }
.ambulance .wheel.rear { left: 12px; }

/* Lights */
.ambulance-light {
  position: absolute; top: 0; width: 6px; height: 6px;
  border-radius: 50%;
  animation: flash-red 0.5s infinite alternate;
}
.ambulance-light.l1 { left: 10px; }
.ambulance-light.l2 { left: 22px; }
@keyframes flash-red { from { background: #f00; box-shadow: 0 0 8px #f00; } to { background: #800; box-shadow: 0 0 3px #800; } }

/* Headlight beams */
.headlight-beam {
  position: absolute; right: -3px; bottom: 24px;
  width: 0; height: 0;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
  border-right: 40px solid rgba(201,162,39,0.08);
  opacity: 0.6;
}

/* Road fog */
.road-fog {
  position: absolute; bottom: 0; left: 0; right: 0; height: 30%;
  background: linear-gradient(180deg, transparent, rgba(10,10,20,0.6));
  pointer-events: none;
}

/* Drive hint */
.drive-hint {
  position: absolute; bottom: 28%; left: 50%;
  transform: translateX(-50%);
  font-size: 11px; color: var(--muted);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }

/* ===== DIALOGUE OVERLAY ===== */
.dialogue-overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.75);
  display: none; flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  z-index: 100;
  padding-bottom: 10vh;
}
.dialogue-overlay.active { display: flex; }

.dialogue-bubble {
  background: var(--panel);
  border: 1.5px solid var(--gold);
  border-radius: 12px;
  padding: 20px 28px;
  max-width: 480px;
  width: 90%;
  animation: fadeUp 0.3s ease;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } }
.dialogue-speaker {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--gold); margin-bottom: 8px;
}
.dialogue-text {
  font-size: 15px; line-height: 1.5; color: var(--text);
  margin-bottom: 16px;
}
.dialogue-choices {
  display: flex; flex-direction: column; gap: 8px;
}
.dialogue-btn {
  background: transparent; border: 1px solid #3a3a4a; color: var(--text);
  padding: 10px 16px; border-radius: 6px; cursor: pointer;
  font-size: 13px; text-align: left; transition: all 0.2s;
  font-family: inherit;
}
.dialogue-btn:hover { border-color: var(--gold); background: rgba(201,162,39,0.08); }
.dialogue-btn.primary { border-color: var(--gold); background: rgba(201,162,39,0.12); }

/* ===== CASE SCENE ===== */
.case-scene {
  position: absolute; inset: 0;
  background: var(--bg);
  display: none; z-index: 200;
}
.case-scene.active { display: flex; }

.case-scene-inner {
  display: flex; width: 100%; height: 100%;
}

.patient-zone {
  flex: 1; position: relative;
  background: radial-gradient(ellipse at center, #12122a 0%, #0a0a1a 100%);
  display: flex; align-items: center; justify-content: center;
}
.patient-bed {
  position: relative; width: 60%; aspect-ratio: 16/9;
  background: linear-gradient(180deg, #1a1a2a, #0e0e18);
  border: 1px solid #2a2a3a; border-radius: 8px;
  overflow: hidden;
}
.patient-figure {
  position: absolute; bottom: 30%; left: 50%; transform: translateX(-50%);
  width: 40px; height: 80px;
}
.patient-figure .head {
  width: 22px; height: 22px; background: #5a5a6a; border-radius: 50%;
  margin: 0 auto;
}
.patient-figure .body {
  width: 34px; height: 50px; background: #4a4a5a; border-radius: 4px 4px 0 0;
  margin: 4px auto 0;
}
.bed-frame { position: absolute; bottom: 20%; left: 10%; right: 10%; height: 6px; background: #3a3a4a; border-radius: 2px; }

.drop-hint {
  position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
  color: var(--muted); font-size: 13px; letter-spacing: 0.05em;
  text-align: center; pointer-events: none; transition: opacity 0.3s;
}

.vitals-strip {
  position: absolute; top: 16px; right: 16px;
  background: var(--panel); border: 1px solid #2a2a3a;
  border-radius: 8px; padding: 10px 14px; font-size: 11px;
  font-family: 'Courier New', monospace;
}
.vitals-strip .vt-val { color: var(--text); margin-left: 8px; }

.stack-sidebar {
  width: 280px; background: var(--panel);
  border-left: 1px solid #2a2a3a;
  display: flex; flex-direction: column;
}
.stack-sidebar-header {
  padding: 16px; border-bottom: 1px solid #2a2a3a;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--gold);
}
.stack-list { flex: 1; overflow-y: auto; padding: 8px; }

.stack-pill {
  padding: 10px 12px; margin: 4px 0;
  background: #1a1a28; border: 1px solid #2a2a3a;
  border-radius: 6px; cursor: grab;
  font-size: 12px; font-weight: 600;
  letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--text); transition: all 0.15s;
}
.stack-pill:hover { border-color: var(--gold); background: #1e1e30; }
.stack-pill:active { cursor: grabbing; }
.stack-pill.placed { opacity: 0.4; text-decoration: line-through; cursor: default; }

.pin-label {
  position: absolute;
  background: #000; color: #fff;
  border: 1.5px solid var(--gold);
  border-radius: 4px;
  padding: 3px 10px;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  cursor: grab; white-space: nowrap;
  z-index: 10;
  transform: translate(-50%, -100%);
  transition: box-shadow 0.2s;
}
.pin-label:hover { box-shadow: 0 0 8px rgba(201,162,39,0.4); }
.pin-label:active { cursor: grabbing; }

.case-header {
  position: absolute; top: 16px; left: 16px; z-index: 10;
}
.case-header .case-id {
  font-size: 10px; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase;
}
.case-header .case-title {
  font-size: 18px; font-weight: 700; color: var(--text); margin-top: 2px;
}

.back-btn {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  background: var(--panel); border: 1px solid var(--gold);
  color: var(--gold); padding: 8px 24px; border-radius: 6px;
  cursor: pointer; font-size: 12px; font-family: inherit;
  z-index: 10; display: none;
}
.back-btn.visible { display: block; }

.transition-overlay {
  position: absolute; inset: 0; background: #000;
  z-index: 150; pointer-events: none;
  opacity: 0; transition: opacity 0.6s;
}
.transition-overlay.active { opacity: 1; }

.city-title {
  position: absolute; top: 6%; left: 5%;
  z-index: 5;
}
.city-title .game-name {
  font-size: 26px; font-weight: 700; color: var(--text); letter-spacing: 0.05em; display: block;
}
.city-title .game-sub {
  font-size: 11px; color: var(--gold); margin-top: 3px;
}

.result-badge {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: var(--green); color: #000; font-weight: 700;
  padding: 6px 16px; border-radius: 4px; font-size: 13px;
  z-index: 20; pointer-events: none;
  animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  display: none;
}
.result-badge.show { display: block; }
@keyframes popIn { from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } }

/* Arrived badge */
.arrived-badge {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: var(--gold); color: #000; font-weight: 700;
  padding: 8px 20px; border-radius: 4px; font-size: 14px;
  z-index: 20; pointer-events: none;
  animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  display: none;
}
.arrived-badge.show { display: block; }
</style>
</head>
<body>

<!-- DRIVING CITY OVERWORLD -->
<div class="city-view" id="cityView">
  <div class="moon"></div>

  <div class="star" style="top:5%;left:10%;width:2px;height:2px;"></div>
  <div class="star" style="top:12%;left:25%;width:1px;height:1px;animation-delay:0.5s;"></div>
  <div class="star" style="top:8%;left:45%;width:2px;height:2px;animation-delay:1s;"></div>
  <div class="star" style="top:15%;left:60%;width:1px;height:1px;animation-delay:0.3s;"></div>
  <div class="star" style="top:6%;left:75%;width:2px;height:2px;animation-delay:0.8s;"></div>
  <div class="star" style="top:18%;left:85%;width:1px;height:1px;animation-delay:0.6s;"></div>

  <!-- Buildings left -->
  <div class="building" style="left:3%;width:70px;height:110px;">
    <div class="window" style="top:10px;left:12px;"></div>
    <div class="window lit" style="top:10px;left:30px;"></div>
    <div class="window" style="top:10px;left:48px;"></div>
    <div class="window lit" style="top:34px;left:12px;"></div>
    <div class="window" style="top:34px;left:30px;"></div>
    <div class="window lit" style="top:34px;left:48px;"></div>
  </div>
  <div class="building" style="left:13%;width:55px;height:85px;">
    <div class="window lit" style="top:8px;left:10px;"></div>
    <div class="window" style="top:8px;left:28px;"></div>
    <div class="window lit" style="top:30px;left:10px;"></div>
    <div class="window" style="top:30px;left:28px;"></div>
  </div>
  <!-- Buildings right -->
  <div class="building" style="left:52%;width:90px;height:130px;">
    <div class="window lit" style="top:8px;left:14px;"></div>
    <div class="window lit" style="top:8px;left:36px;"></div>
    <div class="window lit" style="top:8px;left:58px;"></div>
    <div class="window" style="top:34px;left:14px;"></div>
    <div class="window lit" style="top:34px;left:36px;"></div>
    <div class="window" style="top:34px;left:58px;"></div>
    <div class="window lit" style="top:60px;left:25px;"></div>
    <div class="window" style="top:60px;left:47px;"></div>
  </div>
  <div class="building" style="left:68%;width:65px;height:95px;">
    <div class="window" style="top:8px;left:12px;"></div>
    <div class="window lit" style="top:8px;left:34px;"></div>
    <div class="window lit" style="top:32px;left:12px;"></div>
    <div class="window" style="top:32px;left:34px;"></div>
  </div>
  <div class="building" style="left:82%;width:75px;height:115px;">
    <div class="window lit" style="top:10px;left:14px;"></div>
    <div class="window" style="top:10px;left:34px;"></div>
    <div class="window lit" style="top:10px;left:54px;"></div>
    <div class="window lit" style="top:36px;left:14px;"></div>
    <div class="window" style="top:36px;left:34px;"></div>
    <div class="window lit" style="top:36px;left:54px;"></div>
  </div>

  <!-- Hospital -->
  <div class="hospital-sign" style="left:36%">
    <div class="hospital-cross"></div>
    <div class="hospital-label">Memorial ED</div>
  </div>

  <!-- Streetlamps -->
  <div class="streetlamp" style="left:20%"></div>
  <div class="streetlamp" style="left:65%"></div>

  <div class="city-title">
    <span class="game-name">MeWorld</span>
    <span class="game-sub">City of Medicine — Drive the Streets. Save Lives.</span>
  </div>

  <div class="ground"></div>
  <div class="curb"></div>
  <div class="road">
    <div class="road-line"></div>
    <div class="road-line bottom"></div>
  </div>
  <div class="road-fog"></div>

  <!-- NPC on curb -->
  <div class="npc" id="npc" title="Man flagging down ambulance">
    <div class="npc-head"></div>
    <div class="npc-arm"></div>
    <div class="npc-body"></div>
    <div class="npc-indicator">▼</div>
  </div>

  <!-- Ambulance -->
  <div class="ambulance" id="ambulance">
    <div class="ambulance-light l1"></div>
    <div class="ambulance-light l2"></div>
    <div class="ambulance-cab"></div>
    <div class="ambulance-body"></div>
    <div class="headlight-beam"></div>
    <div class="wheel rear"></div>
    <div class="wheel front"></div>
  </div>

  <div class="drive-hint" id="driveHint">Drive to the patient →</div>
  <div class="arrived-badge" id="arrivedBadge">Patient Found</div>
</div>

<!-- DIALOGUE OVERLAY -->
<div class="dialogue-overlay" id="dialogue">
  <div class="dialogue-bubble" id="dialogueBubble"></div>
</div>

<!-- TRANSITION -->
<div class="transition-overlay" id="transition"></div>

<!-- CASE SCENE -->
<div class="case-scene" id="caseScene">
  <div class="case-scene-inner">
    <div class="patient-zone" id="patientZone"
         data-dropzone
         ondragover="event.preventDefault();"
         ondrop="handleCaseDrop(event)">

      <div class="case-header">
        <div class="case-id">CCS Case 051</div>
        <div class="case-title">Altered Mental Status</div>
      </div>

      <div class="vitals-strip">
        <div>BP <span class="vt-val">115/85</span></div>
        <div>HR <span class="vt-val">88</span></div>
        <div>RR <span class="vt-val">18</span></div>
        <div>SpO₂ <span class="vt-val">96%</span></div>
        <div>Temp <span class="vt-val">36.8°C</span></div>
      </div>

      <div class="patient-bed" id="patientBed">
        <div class="patient-figure">
          <div class="head"></div>
          <div class="body"></div>
        </div>
        <div class="bed-frame"></div>
        <div class="drop-hint" id="dropHint">Drag stacks onto patient</div>
      </div>

      <div class="result-badge" id="resultBadge"></div>
    </div>

    <div class="stack-sidebar">
      <div class="stack-sidebar-header">Treatment Stacks</div>
      <div class="stack-list" id="stackList"></div>
    </div>
  </div>

  <button class="back-btn" id="backBtn" onclick="returnToCity()">Return to City</button>
</div>

<script>
// ── STATE ──
let placed = {};
let pinPositions = {};
let placedOrder = 0;

const CASE_DATA = {
  id: '051',
  title: 'Altered Mental Status',
  diagnosis: 'Transient Ischemic Attack (TIA)',
  stacks: [
    { id: 'ct-head', label: 'CT Head (non-contrast)' },
    { id: 'carotid-duplex', label: 'Carotid Duplex Ultrasound' },
    { id: 'ecg', label: 'ECG — 12 Lead' },
    { id: 'cbc-bmp', label: 'CBC + BMP' },
    { id: 'lipid', label: 'Lipid Panel + HbA1c' },
    { id: 'antiplatelet', label: 'Aspirin 325mg + Clopidogrel' },
    { id: 'mri-brain', label: 'MRI Brain (DWI)' },
    { id: 'echo', label: 'Echocardiogram' },
  ],
};

// ── DOM refs ──
const ambulanceEl = document.getElementById('ambulance');
const npcEl = document.getElementById('npc');
const driveHint = document.getElementById('driveHint');
const arrivedBadge = document.getElementById('arrivedBadge');
const dialogueEl = document.getElementById('dialogue');
const bubble = document.getElementById('dialogueBubble');
const transition = document.getElementById('transition');
const caseScene = document.getElementById('caseScene');
const cityView = document.getElementById('cityView');
const dropHint = document.getElementById('dropHint');
const patientZone = document.getElementById('patientZone');
const resultBadge = document.getElementById('resultBadge');
const backBtn = document.getElementById('backBtn');

let caseComplete = false;
let driving = false;

// ── DRIVE TO PATIENT ──
function startDrive() {
  if (driving || caseComplete) return;
  driving = true;
  driveHint.style.display = 'none';

  // Animate ambulance driving right toward the NPC
  ambulanceEl.style.left = '55%';

  // Show arrived badge after drive completes
  setTimeout(() => {
    arrivedBadge.classList.add('show');
    setTimeout(() => {
      arrivedBadge.classList.remove('show');
      arriveAtScene();
    }, 1500);
  }, 4200);
}

// Click ambulance or anywhere to start driving
ambulanceEl.addEventListener('click', startDrive);
npcEl.addEventListener('click', startDrive);

function arriveAtScene() {
  showDialogue('Wife of Patient',
    "Doctor, thank god you're here! My husband — Kwame — he was walking and suddenly his right arm went weak, he couldn't talk right. It passed now but he's not himself. He's 67, has high blood pressure, stopped taking his pills.",
    [
      { text: 'How long did the episode last?', next: 'duration' },
      { text: 'Any other medical history?', next: 'history' },
      { text: "Let me examine him right now.", next: 'exam' },
    ]
  );
}

const DIALOGUE_STEPS = {
  duration: {
    speaker: 'Wife of Patient',
    text: 'Maybe 30, 40 minutes? He was sitting on the curb, I ran over and he was slurring. By the time I got him water, it cleared. But his right side was heavy, he said.',
    choices: [
      { text: 'Any other medical history?', next: 'history' },
      { text: 'Let me examine him', next: 'exam' },
    ],
  },
  history: {
    speaker: 'Wife of Patient',
    text: 'High blood pressure. They gave him lisinopril but the cough made him stop. He smokes — 40 years now, a pack a day. He won\'t listen to me about it.',
    choices: [
      { text: 'How long did the episode last?', next: 'duration' },
      { text: 'Let me examine him', next: 'exam' },
    ],
  },
  exam: {
    speaker: 'You (Physician)',
    text: 'You auscultate the neck… there — a carotid bruit over the right side. Neuro exam is now normal. BP 155/92. This is a TIA — transient ischemic attack. The carotid artery may be narrowed. He needs immediate ED workup — CT, carotid duplex, ECG, labs, antiplatelets. 10-15% stroke risk in 90 days.',
    choices: [
      { text: 'Load him into the ambulance → ED Bay', next: 'enter_case', primary: true },
    ],
  },
};

function showDialogue(speaker, text, choices) {
  let html = `<div class="dialogue-speaker">${speaker}</div>`;
  html += `<div class="dialogue-text">${text}</div>`;
  html += `<div class="dialogue-choices">`;
  choices.forEach((c) => {
    html += `<button class="dialogue-btn${c.primary ? ' primary' : ''}" onclick="handleChoice('${c.next}')">${c.text}</button>`;
  });
  html += `</div>`;
  bubble.innerHTML = html;
  dialogueEl.classList.add('active');
}

function handleChoice(next) {
  if (next === 'enter_case') {
    enterCase();
  } else if (DIALOGUE_STEPS[next]) {
    const s = DIALOGUE_STEPS[next];
    showDialogue(s.speaker, s.text, s.choices);
  }
}

// ── TRANSITION INTO CASE ──
function enterCase() {
  dialogueEl.classList.remove('active');
  transition.classList.add('active');
  setTimeout(() => {
    cityView.style.display = 'none';
    caseScene.classList.add('active');
    setTimeout(() => {
      transition.classList.remove('active');
      renderStacks();
    }, 400);
  }, 600);
}

// ── STACK RENDERING ──
function renderStacks() {
  const list = document.getElementById('stackList');
  list.innerHTML = CASE_DATA.stacks.map((s, i) => `
    <div class="stack-pill${placed[s.id] ? ' placed' : ''}"
         draggable="${placed[s.id] ? 'false' : 'true'}"
         id="pill-${s.id}"
         ondragstart="handleDragStart(event, '${s.id}')"
         ondragend="handleDragEnd(event, '${s.id}')">
      ${String(i + 1).padStart(2, '0')} · ${s.label}
    </div>
  `).join('');
}

// ── NATIVE HTML5 DRAG ──
function handleDragStart(e, ivId) {
  if (placed[ivId]) { e.preventDefault(); return; }
  e.dataTransfer.setData('application/stack-iv-id', ivId);
  e.dataTransfer.effectAllowed = 'move';
}

function handleDragEnd(e, ivId) {}

function handleCaseDrop(e) {
  e.preventDefault();
  const ivId = e.dataTransfer.getData('application/stack-iv-id');
  if (!ivId || placed[ivId]) return;

  const zone = patientZone;
  const rect = zone.getBoundingClientRect();
  const cx = (e.clientX - rect.left) / rect.width;
  const cy = (e.clientY - rect.top) / rect.height;

  const offset = placedOrder * 0.025;
  const px = cx + offset;
  const py = cy + offset;

  placed[ivId] = true;
  pinPositions[ivId] = { cx: px, cy: py };
  placedOrder++;

  const stack = CASE_DATA.stacks.find((s) => s.id === ivId);
  const pin = document.createElement('div');
  pin.className = 'pin-label';
  pin.id = `pin-${ivId}`;
  pin.textContent = stack.label;
  pin.style.left = `${px * 100}%`;
  pin.style.top = `${py * 100}%`;
  pin.draggable = true;
  pin.dataset.ivId = ivId;

  pin.addEventListener('dragstart', (ev) => {
    ev.dataTransfer.setData('application/reposition-pin', ivId);
    ev.dataTransfer.effectAllowed = 'move';
  });

  pin.addEventListener('dragend', (ev) => {
    const r = zone.getBoundingClientRect();
    const nx = Math.max(0, (ev.clientX - r.left) / r.width);
    const ny = Math.max(0, (ev.clientY - r.top) / r.height);
    pin.style.left = `${nx * 100}%`;
    pin.style.top = `${ny * 100}%`;
    pinPositions[ivId] = { cx: nx, cy: ny };
  });

  zone.appendChild(pin);

  const pill = document.getElementById(`pill-${ivId}`);
  if (pill) {
    pill.classList.add('placed');
    pill.draggable = false;
    pill.textContent = pill.textContent + ' ✓';
  }

  dropHint.style.opacity = '0';
  checkAllPlaced();
}

function checkAllPlaced() {
  const allPlaced = CASE_DATA.stacks.every((s) => placed[s.id]);
  if (allPlaced) {
    resultBadge.textContent = 'All stacks placed — TIA workup complete ✓';
    resultBadge.classList.add('show');
    backBtn.classList.add('visible');
    caseComplete = true;
  }
}

// ── RETURN TO CITY ──
function returnToCity() {
  transition.classList.add('active');
  setTimeout(() => {
    caseScene.classList.remove('active');
    cityView.style.display = 'block';
    backBtn.classList.remove('visible');
    resultBadge.classList.remove('show');

    // Update NPC — now at hospital
    npcEl.querySelector('.npc-body').style.background = '#3a6a3a';
    npcEl.title = 'Kwame Mensah — admitted to Memorial ED';
    ambulanceEl.style.left = '80%';

    setTimeout(() => transition.classList.remove('active'), 400);

    driveHint.style.display = 'block';
    driveHint.textContent = 'More patients need you →';
    ambulanceEl.style.left = '-120px';
    driving = false;
    caseComplete = false;
  }, 600);
}

// ── Auto-start drive after 1s ──
setTimeout(startDrive, 1500);
</script>
</body>
</html>
