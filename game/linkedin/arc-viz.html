<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeWorld · Content Arc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;450;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: var(--fs-body); }
  :root { --fs-body: 17px; }

  :root {
    --bg: #ffffff; --bg-subtle: #f5f5f7; --bg-surface: #fafafa;
    --border: #e5e5e5; --border-hi: #d1d1d6;
    --text: #1d1d1f; --text-soft: #6e6e73; --text-muted: #aeaeb2;
    --accent: #0071e3; --accent-bg: #e8f0fe;
    --dot-draft: #aeaeb2; --dot-ready: #f5a623; --dot-posted: #34c759;
    --ready-bg: #fef9e7; --ready-text: #7d5e00;
    --posted-bg: #e8f8ee; --posted-text: #1a5e2a;
    --shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.06);
  }

  [data-theme="dark"] {
    --bg: #000000; --bg-subtle: #1c1c1e; --bg-surface: #111111;
    --border: #2c2c2e; --border-hi: #3a3a3c;
    --text: #f5f5f7; --text-soft: #98989d; --text-muted: #636366;
    --accent: #2997ff; --accent-bg: #1a2d4a;
    --dot-draft: #636366; --dot-ready: #f5a623; --dot-posted: #30d158;
    --ready-bg: #2d2410; --ready-text: #f5a623;
    --posted-bg: #11291a; --posted-text: #30d158;
    --shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 2px 8px rgba(0,0,0,0.3);
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
    -webkit-font-smoothing: antialiased; transition: background 0.3s, color 0.3s; user-select: none;
  }
  .app { max-width: 720px; margin: 0 auto; padding: 24px 28px 16px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .topbar { display: flex; align-items: center; margin-bottom: 10px; }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .topbar-left h1 { font-size: 17px; font-weight: 500; letter-spacing: -0.01em; white-space: nowrap; margin: 0; }
  .chip { display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 20px; border: 0.5px solid var(--border); background: var(--bg-surface); font-size: 12px; font-weight: 450; color: var(--text-soft); cursor: pointer; font-family: inherit; letter-spacing: -0.01em; transition: all 0.15s; }
  .chip:hover { border-color: var(--border-hi); color: var(--text); }
  .chip.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .chip svg { width: 14px; height: 14px; stroke: currentColor; }

  /* FLOATING SPINE PANEL */
  .spine-panel {
    position: fixed; z-index: 1000;
    top: 80px; left: 24px; /* start position, overwritten by drag */
    width: 340px; max-height: 70vh;
    background: var(--bg); border: 0.5px solid var(--border-hi);
    border-radius: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.08);
    display: flex; flex-direction: column;
    transition: opacity 0.25s ease, transform 0.25s ease;
    opacity: 1; transform: translateY(0);
  }
  [data-theme="dark"] .spine-panel { box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3); }
  .spine-panel.hidden { opacity: 0; transform: translateY(-8px); pointer-events: none; }
  .spine-panel.minimized .spine-body { display: none; }
  .spine-handle {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 14px; cursor: grab; user-select: none;
    border-bottom: 0.5px solid var(--border); flex-shrink: 0;
    font-size: 10px; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.08em; font-weight: 500;
  }
  .spine-handle:active { cursor: grabbing; }
  .spine-handle-actions { display: flex; gap: 4px; }
  .spine-hdr-btn {
    width: 22px; height: 22px; border-radius: 6px; border: none;
    background: transparent; color: var(--text-muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; line-height: 1; transition: all 0.15s;
  }
  .spine-hdr-btn:hover { background: var(--border); color: var(--text); }
  .spine-body {
    overflow-y: auto; padding: 14px 16px; flex: 1;
    font-size: 0.78rem; color: var(--text); line-height: 1.9;
    font-weight: 350; letter-spacing: -0.01em;
  }
  .spine-body::-webkit-scrollbar { width: 3px; }
  .spine-body::-webkit-scrollbar-track { background: transparent; }
  .spine-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .spine-body { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .spine-body .spine-sentence { display: inline; cursor: pointer; padding: 1px 0; border-bottom: 1px solid transparent; transition: all 0.2s; }
  .spine-body .spine-sentence:hover { color: var(--accent); }
  .spine-body .spine-sentence.highlight { color: var(--text); font-weight: 450; border-bottom-color: var(--accent); }
  .spine-body .spine-sentence.faded { color: var(--text-muted); }
  .spine-sep { color: var(--border-hi); margin: 0 2px; }
  .spine-post-refs { display: inline; margin-left: 4px; }
  .spine-post-ref { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--dot-draft); margin: 0 1px; cursor: pointer; vertical-align: middle; transition: all 0.15s; }
  .spine-post-ref.active { background: var(--text); width: 9px; height: 9px; }
  .spine-post-ref:hover { background: var(--accent); }
  .spine-post-ref.ready { background: var(--dot-ready); }
  .spine-post-ref.posted { background: var(--dot-posted); }
  .spine-post-ref.active.ready { background: var(--ready-text); }
  .spine-post-ref.active.posted { background: var(--posted-text); }

  /* FLOATING TIMELINE PANEL (right side) */
  .tl-panel {
    position: fixed; z-index: 999;
    top: 80px; right: 24px;
    width: 260px; max-height: 70vh;
    background: var(--bg); border: 0.5px solid var(--border-hi);
    border-radius: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.08);
    display: flex; flex-direction: column;
    transition: opacity 0.25s ease, transform 0.25s ease;
    opacity: 1; transform: translateY(0);
  }
  [data-theme="dark"] .tl-panel { box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3); }
  .tl-panel.hidden { opacity: 0; transform: translateY(-8px); pointer-events: none; }
  .tl-panel.minimized .tl-body { display: none; }
  .tl-handle {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 14px; cursor: grab; user-select: none;
    border-bottom: 0.5px solid var(--border); flex-shrink: 0;
    font-size: 10px; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.08em; font-weight: 500;
  }
  .tl-handle:active { cursor: grabbing; }
  .tl-handle-actions { display: flex; gap: 4px; }
  .tl-hdr-btn {
    width: 22px; height: 22px; border-radius: 6px; border: none;
    background: transparent; color: var(--text-muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; line-height: 1; transition: all 0.15s;
  }
  .tl-hdr-btn:hover { background: var(--border); color: var(--text); }
  .tl-body {
    overflow-y: auto; padding: 8px 0; flex: 1;
  }
  .tl-body::-webkit-scrollbar { width: 3px; }
  .tl-body::-webkit-scrollbar-track { background: transparent; }
  .tl-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .tl-body { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .tl-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px; cursor: pointer;
    transition: background 0.1s;
    border-left: 2px solid transparent;
  }
  .tl-row:hover { background: var(--bg-subtle); }
  .tl-row.active { background: var(--accent-bg); }
  .tl-row.ready { border-left-color: var(--dot-ready); }
  .tl-row.posted { border-left-color: var(--dot-posted); }
  .tl-row.ready .tl-date { color: var(--ready-text); font-weight: 500; }
  .tl-row.posted .tl-date { color: var(--posted-text); font-weight: 500; }
  .tl-row.ready .tl-act { color: var(--ready-text); opacity: 0.8; }
  .tl-row.posted .tl-act { color: var(--posted-text); opacity: 0.8; }
  .tl-dot {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    border: 0.5px solid var(--border-hi); background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 500; color: var(--text-muted);
    transition: all 0.15s;
  }
  .tl-take-count {
    width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent-bg); border: 0.5px solid var(--accent);
    color: var(--accent); font-size: 7px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .tl-row.active .tl-take-count {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .tl-row.ready .tl-dot { background: var(--ready-bg); border-color: var(--dot-ready); color: var(--ready-text); }
  .tl-row.posted .tl-dot { background: var(--posted-bg); border-color: var(--dot-posted); color: var(--posted-text); }
  .tl-row.active .tl-dot, .tl-row.active.ready .tl-dot, .tl-row.active.posted .tl-dot { background: var(--text); color: var(--bg); border-color: var(--text); }
  .tl-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .tl-date { font-size: 9px; color: var(--text-muted); font-weight: 450; letter-spacing: 0.02em; }
  .tl-act { font-size: 8px; color: var(--text-muted); font-weight: 450; letter-spacing: 0.03em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-row.active .tl-date, .tl-row.active .tl-act { color: var(--text-soft); }
  .tl-divider {
    padding: 4px 14px 2px; font-size: 8px; font-weight: 500;
    color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em;
  }
  .tl-legend {
    display: flex; gap: 10px; padding: 6px 14px 8px;
    border-top: 0.5px solid var(--border); flex-shrink: 0;
  }
  .tl-legend-item { display: flex; align-items: center; gap: 4px; font-size: 8px; color: var(--text-muted); font-weight: 450; letter-spacing: 0.02em; }
  .tl-legend-dot { width: 6px; height: 6px; border-radius: 50%; }
  .tl-legend-dot.l-draft { background: var(--dot-draft); }
  .tl-legend-dot.l-ready { background: var(--dot-ready); }
  .tl-legend-dot.l-posted { background: var(--dot-posted); }

  /* READER */
  .reader-wrap { flex: 1; min-height: 0; overflow: hidden; transition: opacity 0.35s ease; }
  .reader-wrap.collapsed { opacity: 0; flex: 0; min-height: 0; }
  .reader { background: var(--bg-subtle); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .reader-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .act-badge { font-size: 9px; padding: 3px 10px; border-radius: 14px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; flex-shrink: 0; }
  .reader-spine-context { font-size: 0.65rem; color: var(--text-muted); font-weight: 400; font-style: italic; letter-spacing: -0.01em; flex-shrink: 0; }
  .reader-edit-btn { width: 28px; height: 28px; border-radius: 50%; border: 0.5px solid var(--border); background: var(--bg); color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: all 0.15s; flex-shrink: 0; }
  .reader-edit-btn:hover { border-color: var(--border-hi); color: var(--text); }
  .reader-edit-btn.editing { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .reader-mic-btn { width: 30px; height: 30px; border-radius: 50%; border: 0.5px solid var(--border); background: var(--bg); color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; padding: 0; }
  .reader-mic-btn svg { width: 16px; height: 16px; }
  .reader-mic-btn:hover { border-color: var(--accent); color: var(--accent); }
  .reader-mic-btn.recording { background: #ff3b30; border-color: #ff3b30; color: #fff; }
  .reader-mic-btn.recording:hover { background: #ff3b30; color: #fff; }
  .reader-toolbar { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; flex-shrink: 0; }
  .reader-toolbar .chip { font-size: 10px; padding: 3px 8px; gap: 3px; }
  .reader-toolbar .chip svg { width: 11px; height: 11px; }
  .reader-toolbar .fs-chip { font-size: 10px; }
  .reader-toolbar .fs-btn { padding: 3px 5px; font-size: 10px; }
  .reader-edit-area { display: none; flex: 1; min-height: 0; flex-direction: column; gap: 8px; }
  .reader-edit-area.active { display: flex; }
  .reader-body.hidden { display: none; }
  .reader-edit-area textarea { flex: 1; min-height: 0; width: 100%; font-family: 'Inter', sans-serif; font-size: 0.88rem; color: var(--text); background: var(--bg); border: 0.5px solid var(--border-hi); border-radius: 8px; padding: 12px 14px; resize: none; line-height: 1.85; font-weight: 420; letter-spacing: -0.01em; }
  .reader-edit-area textarea:focus { outline: none; border-color: var(--accent); }
  .reader-edit-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .reader-edit-save { font-size: 11px; padding: 5px 16px; border-radius: 14px; border: none; background: var(--accent); color: #fff; cursor: pointer; font-family: inherit; font-weight: 500; }
  .reader-edit-cancel { font-size: 11px; padding: 5px 16px; border-radius: 14px; border: 0.5px solid var(--border); background: var(--bg-surface); color: var(--text-soft); cursor: pointer; font-family: inherit; font-weight: 450; }
  .read-toggle-bar { display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-bottom: 10px; }
  .read-toggle-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; }
  .read-toggle-btn { font-size: 10px; padding: 4px 12px; border-radius: 20px; border: 0.5px solid var(--border); background: var(--bg-surface); color: var(--text-soft); cursor: pointer; font-family: inherit; font-weight: 450; letter-spacing: -0.01em; transition: all 0.15s; }
  .read-toggle-btn:hover { border-color: var(--border-hi); color: var(--text); }
  .read-toggle-btn.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .fuse-btn { font-size: 10px; padding: 4px 14px; border-radius: 20px; border: none; background: var(--accent); color: #fff; cursor: pointer; font-family: inherit; font-weight: 500; letter-spacing: -0.01em; transition: all 0.15s; margin-left: auto; }
  .fuse-btn:hover { filter: brightness(1.1); }
  .fuse-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .fuse-btn.fusing { animation: fuse-pulse 0.8s ease infinite; }
  @keyframes fuse-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .reader-body { font-size: 0.88rem; color: var(--text); line-height: 1.85; white-space: pre-wrap; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 420; letter-spacing: -0.01em; flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 8px; }
  .reader-body::-webkit-scrollbar { width: 4px; }
  .reader-body::-webkit-scrollbar-track { background: transparent; }
  .reader-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .reader-body { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .reader-controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 1.25rem; flex-wrap: wrap; }
  .nav-group { display: flex; gap: 8px; align-items: center; }
  .status-group { display: flex; gap: 6px; align-items: center; }

  /* NAV BAR (outside reader card) */
  .nav-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; padding: 8px 0; flex-wrap: wrap; flex-shrink: 0; }
  .nav-bar .nav-group { display: flex; gap: 8px; align-items: center; }
  .status-row { display: flex; gap: 6px; align-items: center; margin-top: 1rem; }
  .status-btn { font-size: 11px; padding: 4px 10px; border-radius: 20px; border: 0.5px solid var(--border); background: var(--bg-surface); color: var(--text-soft); cursor: pointer; font-family: inherit; font-weight: 450; letter-spacing: -0.01em; transition: all 0.15s; }
  .status-btn:hover { border-color: var(--border-hi); color: var(--text); }
  .status-btn.active-draft { background: var(--bg); color: var(--text); border-color: var(--text-muted); }
  .status-btn.active-ready { background: var(--ready-bg); color: var(--ready-text); border-color: var(--dot-ready); }
  .status-btn.active-posted { background: var(--posted-bg); color: var(--posted-text); border-color: var(--dot-posted); }
  .status-btn.s-draft { color: var(--text-muted); border-color: var(--text-muted); }
  .status-btn.s-ready { color: var(--ready-text); border-color: var(--dot-ready); }
  .status-btn.s-posted { color: var(--posted-text); border-color: var(--dot-posted); }
  .nav-row { display: flex; gap: 8px; margin-top: 1rem; align-items: center; }
  .post-num { font-size: 12px; color: var(--text-muted); margin: 0 4px; }
  .post-count { font-size: 12px; color: var(--text-muted); margin: auto; }
  .nav-btn { font-size: 12px; padding: 6px 14px; border-radius: 20px; border: 0.5px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; font-family: inherit; font-weight: 450; letter-spacing: -0.01em; transition: all 0.15s; }
  .nav-btn:hover:not(:disabled) { border-color: var(--border-hi); }
  .nav-btn:disabled { opacity: 0.25; cursor: default; }

  .kbd-hint { font-size: 9px; color: var(--text-muted); text-align: center; margin-top: 8px; letter-spacing: 0.02em; flex-shrink: 0; }

  /* speech-to-text */
  .speech-bar { display: none; align-items: center; gap: 10px; margin-top: 6px; padding: 6px 12px; background: var(--bg-subtle); border-radius: 10px; border: 0.5px solid var(--border); flex-shrink: 0; }
  .speech-bar.recording { display: flex; }
  .speech-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff3b30; animation: pulse 1.2s ease infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .speech-text { font-size: 13px; color: var(--text-soft); font-family: 'Inter', sans-serif; font-weight: 400; font-style: italic; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reader-mic-btn.recording { background: #ff3b30; border-color: #ff3b30; color: #fff; }
  .reader-mic-btn.recording:hover { background: #ff3b30; color: #fff; }

  /* takes panel — floating, centered over lower edge of post */
  .takes-panel {
    position: fixed; z-index: 998;
    bottom: 20px; left: 50%; transform: translateX(-50%);
    width: 380px; max-height: 36vh;
    background: var(--bg); border: 0.5px solid var(--border-hi);
    border-radius: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.08);
    display: none; flex-direction: column;
    transition: opacity 0.2s ease;
  }
  [data-theme="dark"] .takes-panel { box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3); }
  .takes-panel.visible { display: flex; }
  .takes-panel.hidden { display: none; }
  .takes-panel.minimized .takes-list { display: none; }
  .takes-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; border-bottom: 0.5px solid var(--border); font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; flex-shrink: 0; cursor: grab; user-select: none; }
  .takes-header:active { cursor: grabbing; }
  .takes-header-actions { display: flex; gap: 4px; }
  .takes-hdr-btn {
    width: 22px; height: 22px; border-radius: 6px; border: none;
    background: transparent; color: var(--text-muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; line-height: 1; transition: all 0.15s;
  }
  .takes-hdr-btn:hover { background: var(--border); color: var(--text); }
  .takes-list { overflow-y: auto; flex: 1 1 0; min-height: 0; }
  .takes-list::-webkit-scrollbar { width: 3px; }
  .takes-list::-webkit-scrollbar-track { background: transparent; }
  .takes-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .takes-empty { padding: 16px 14px; font-size: 11px; color: var(--text-muted); font-style: italic; text-align: center; }
  .takes-resize-handle { width: 14px; height: 14px; position: absolute; bottom: 0; right: 0; cursor: nwse-resize; z-index: 1; }
  .takes-resize-handle::after {
    content: ""; position: absolute; bottom: 4px; right: 4px;
    width: 10px; height: 10px;
    border-right: 2px solid var(--border); border-bottom: 2px solid var(--border);
  }
  .take-row { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 0.5px solid var(--border); font-size: 12px; transition: background 0.1s; }
  .take-row:last-child { border-bottom: none; }
  .take-row:hover { background: var(--bg); }
  .take-row.selected { background: var(--accent-bg); }
  .take-play-btn { width: 30px; height: 30px; border-radius: 50%; border: 0.5px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; padding: 0; }

  .take-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .take-label { font-weight: 500; font-size: 11px; color: var(--text); letter-spacing: -0.01em; }

  .take-use-btn { font-size: 9px; padding: 3px 10px; border-radius: 14px; border: 0.5px solid var(--border); background: var(--bg-surface); color: var(--text-soft); cursor: pointer; font-family: inherit; font-weight: 450; transition: all 0.15s; }
  .take-use-btn:hover { border-color: var(--border-hi); color: var(--text); }

  .take-del-btn { width: 24px; height: 24px; border-radius: 50%; border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }

  .take-edit-btn { font-size: 9px; padding: 3px 10px; border-radius: 14px; border: 0.5px solid var(--border); background: var(--bg-surface); color: var(--text-soft); cursor: pointer; font-family: inherit; font-weight: 450; transition: all 0.15s; }

  .take-edit-textarea { width: 100%; min-height: 54px; font-family: 'Inter', sans-serif; font-size: 11px; color: var(--text); background: var(--bg); border: 0.5px solid var(--border-hi); border-radius: 6px; padding: 6px 8px; resize: vertical; line-height: 1.45; }

  .take-edit-cancel { font-size: 10px; padding: 4px 14px; border-radius: 14px; border: 0.5px solid var(--border); background: var(--bg-surface); color: var(--text-soft); cursor: pointer; font-family: inherit; font-weight: 450; line-height: 1; }

  /* segment audio editor */

  .takes-panel.seg-mode .takes-list { display: none; }

  .seg-block { display: flex; align-items: flex-start; gap: 6px; padding: 6px 8px; border-radius: 6px; border: 0.5px solid var(--border); background: var(--bg); cursor: pointer; transition: all 0.12s; }
  .seg-block:hover { border-color: var(--border-hi); background: var(--bg-surface); }

  .seg-snip-btn { font-size: 10px; padding: 4px 10px; border-radius: 14px; border: 0.5px solid var(--border); background: var(--bg-surface); color: var(--text-soft); cursor: pointer; font-family: inherit; font-weight: 450; transition: all 0.15s; }

  .seg-empty { font-size: 11px; color: var(--text-muted); text-align: center; padding: 16px; }
  .seg-hdr-btn { width: 24px; height: 24px; border-radius: 50%; border: 0.5px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }

  /* minimal scrollbar */

<div class="app">

  <!-- FLOATING TIMELINE PANEL (right side) -->

      <div class="tl-handle-actions">

  <!-- FLOATING TAKES PANEL (right side, below timeline) -->

          <button class="seg-rerecord-btn" id="seg-rerecord-btn" onclick="startReRecord()" title="Re-record selected segment">🔴 Rec</button>

      Spine
    </button>
    <button class="chip active" id="btn-reader" onclick="toggleReader()" title="Toggle post reader">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2M9 5a2 2 0 002 2h2a2 2 0 002-2"/></svg>

    </button>
    <button class="chip active" id="btn-timeline" onclick="toggleTimeline()" title="Toggle floating timeline panel">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="5" r="1.5"/><circle cx="19" cy="7" r="1.5"/><circle cx="8" cy="19" r="1.5"/></svg>

    <button class="chip" id="btn-takes" onclick="toggleTakes()" title="Toggle floating takes panel">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>

    <div class="fs-chip" id="fs-chip">

      <span class="fs-val" id="fs-val">17</span>

    <button class="reader-edit-btn" id="reader-edit-btn" onclick="toggleReaderEdit()" title="Edit post body">✎</button>
    <button class="reader-mic-btn" id="btn-mic" onclick="toggleMic()" title="Speech-to-text — read aloud to transcribe">
      <svg id="mic-idle" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke="currentColor"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>
      <svg id="mic-rec" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke="currentColor" style="display:none"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
    </button>
    <button class="chip" id="btn-theme" onclick="toggleTheme()" title="Toggle light/dark mode">
      <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke-width="1.5"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke-width="1.5" style="display:none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
    </button>
    <button class="chip" onclick="packageAll()" title="Package JSON + audio into a zip folder by spine">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M12 2l7 7H5l7-7z"/><rect x="4" y="9" width="16" height="13" rx="2"/><line x1="9" y1="16" x2="15" y2="16"/></svg>
    </button>
    <button class="chip" onclick="importTakes()" title="Import takes from JSON file">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </button>

  <!-- READER -->

        <button class="read-toggle-btn" id="read-toggle-spoken" onclick="switchReadMode('spoken')">My Read</button>
        <button class="read-toggle-btn" id="read-toggle-fused" onclick="switchReadMode('spoken')" style="display:none">Fused</button>
        <button class="fuse-btn" id="fuse-btn" onclick="fuseWithLLM()">✦ Fuse</button>
      </div>
      <div class="reader-body" id="r-body"></div>
      <div class="reader-edit-area" id="reader-edit-area">

  <!-- NAVIGATION BAR (outside reader, always visible) -->

  <div class="kbd-hint">← → arrow keys &nbsp;·&nbsp; Map &nbsp;·&nbsp; Spine &nbsp;·&nbsp; Takes &nbsp;·&nbsp; Read (mic)</div>

<script>
/* ── SPINE ── */
const spine = [
  "I grew up in two worlds that both knew how to make someone good at something.",
  "In visual arts, you had a sandbox.",
  "Caleb solved the problem in his mind before his hands ever touched anything.",
  "There is something in a human that triggers when it sees a thought being worked out.",
  "Then I walked into medicine.",
  "Everything was routinized. Memorize this pathway.",
  "There is a specific kind of freeze. It is not the freeze of not knowing.",
  "For years I thought that was imposter syndrome. In visual arts I had none.",
  "I caught myself ordering tests because a textbook told me to.",
  "The system was outputting decent, well-behaved people practising defensive medicine.",
  "Medicine never had a sandbox.",
  "Once I saw that, I could not ignore it.",
  "So I built the room.",
  "You do not choose a topic. You choose a patient.",
  "An AI attending teaches while you work, using the actual numbers in front of you.",
  "Get it wrong and the patient gets worse. On purpose.",
  "A 13 year old and a physician can walk the same case. Both should learn something.",
  "The AI explains. The physiology decides.",
  "I am documenting how I think, not just what I built.",
  "I trained to memorize. I am building so the next doctor does not have to."
];

/* ── POSTS ── Each post hangs from a spine sentence (spineIdx, 0-based) ── */
const posts = [
  { date:"Mon Jun 29", act:"Two worlds", spineIdx:0, spine:"I grew up in two worlds that both knew how to make someone good at something.", body:"I grew up in two worlds that both knew how to make someone good at something.\n\nIn visual arts, you had a sandbox. You made something ugly, looked at it, and made it again. Fast. And in apprenticeship, you had a master standing next to you, his process visible right before you. You see him failing, correcting it in real time. There is something in a human that triggers when it sees a thought being worked out.\n\nBoth worlds gave you the same thing. Real time feedback. A room where being wrong was just the next step.\n\nThen I walked into medicine and thought, how hard can it be, right? Oh boy was I wrong." },
  { date:"Tue Jun 30", act:"The sandbox", spineIdx:1, spine:"In visual arts, you had a sandbox.", body:"In visual arts, you had a sandbox.\n\nYou did not wait until you were ready. You made something. You looked at it. You made it again. The feedback was immediate and the stakes were low and that is exactly how you got good.\n\nI drew the same hand hundreds of times before anyone depended on it. Each attempt was just information. Wrong proportions. Fix it. Wrong shadow. Fix it. The wrongness was the lesson.\n\nNobody handed me a textbook about hands. They handed me paper and said go.\n\nThat is how mastery works. Not in the knowing. In the doing it again." },
  { date:"Thu Jul 2",  act:"The master", spineIdx:2, spine:"Caleb solved the problem in his mind before his hands ever touched anything.", body:"His name is Caleb Oppong. Master artisan. He taught me everything I know about making things.\n\nAnd here is what I noticed about him. He never rushed to the work. He would stand and look at the problem for a long time. Turning it over in his mind. Running through it. And then when he sat down, he moved with conviction. Every cut, every join, every decision had already been made before his hands touched anything.\n\nThat is what mastery looks like from the outside. Not speed. Clarity.\n\nWhen you have seen something enough times, in your hands and in your mind, the decision is already made before the moment arrives. You are not figuring it out. You are executing what you already know.\n\nI watched him and I understood something. Mastery is not talent. It is accumulated reps." },
  { date:"Fri Jul 3",  act:"Real time feedback", spineIdx:3, spine:"There is something in a human that triggers when it sees a thought being worked out.", body:"There is something in a human that triggers when it sees a thought being worked out in real time.\n\nNot explained. Worked out. The difference matters.\n\nWhen Caleb was solving a problem in front of me, I was not just watching his hands. I was watching his mind. Where he paused. What he reconsidered. The moment he saw something I had not seen yet.\n\nThat is a different kind of learning. Not information transfer. Pattern recognition at a level you cannot get from a page.\n\nYou absorb it without knowing you are absorbing it. And then one day your hands know something your mouth cannot explain.\n\nThat is what real time feedback does. It builds something in you that memorization cannot reach." },
  { date:"Mon Jul 6",  act:"Walking in", spineIdx:4, spine:"Then I walked into medicine.", body:"Then I walked into medicine.\n\nAnd I assumed it would work the same way. You learn the craft. You find your master. You put in the reps. You get good.\n\nBut medicine is not built like that.\n\nMedicine is built on a different assumption. That if you know enough, you will perform enough. That knowledge and execution are the same thing. That a pathway memorized is a pathway walked.\n\nI believed that for longer than I should have.\n\nThe first time a real patient was in front of me, I found out it was not true." },
  { date:"Tue Jul 7",  act:"Routinization", spineIdx:5, spine:"Everything was routinized. Memorize this pathway.", body:"Everything was routinized.\n\nMemorize this pathway. Pass this exam. Carry it in your head and prove you can recite it under pressure. The world calling that brilliance.\n\nAnd I did it. I was good at it. I could recite the differential for pulmonary edema in my sleep. Cardiomyopathy. Fluid overload. The failing pump. Every step in the right order.\n\nBut reciting a pathway and walking it on a real person in a real room are two completely different things. Nobody told me that. Or maybe they did and I did not understand what they meant until I was standing at a bedside and the pathway felt very far away.\n\nSo I kept passing exams until I did not want to anymore.\n\nIf I am really going to treat a human being, should I not spend more time understanding than memorizing?" },
  { date:"Thu Jul 9",  act:"The freeze", spineIdx:6, spine:"There is a specific kind of freeze. It is not the freeze of not knowing.", body:"There is a specific kind of freeze.\n\nIt is not the freeze of not knowing. It is the freeze of knowing everything and still not being able to move.\n\nI remember the bedside. Crackles on auscultation. The pathway was right there. Cardiomyopathy. Pulmonary edema. The fluid, the failing pump, the reason the lungs were filling. I had read it. I had memorized every step.\n\nBut I had never walked it on a real person before.\n\nAnd there is something that happens in that gap. Between what you know and what your hands are willing to do. The knowledge sits in your head. The patient is in front of you. And there is this terrible distance between the two.\n\nIf I had seen that case ten times before in a simulation, it would have been easy. The hands would have known. But I had not. So I froze.\n\nThat is not imposter syndrome. That is just what happens when the reps were never there." },
  { date:"Fri Jul 10", act:"Imposter syndrome", spineIdx:7, spine:"For years I thought that was imposter syndrome. In visual arts I had none.", body:"For years I thought that was imposter syndrome.\n\nI carried it like it was a character flaw. The hesitation. The second-guessing. The gap between what I knew and what I could do in the room.\n\nBut here is the thing. In visual arts I had no imposter syndrome. None. I made ugly things and fixed them and made better things and that was just the process. I never felt like a fraud because I was always in the work.\n\nIn medicine I felt like a fraud constantly.\n\nAnd for a long time I blamed myself for that difference.\n\nBut the difference was not me. The difference was the sandbox. In art I had one. In medicine I did not. And you cannot build confidence in a space that never lets you fail safely.\n\nThe imposter syndrome was just the absence of reps wearing a psychological costume." },
  { date:"Mon Jul 13", act:"Ordering tests", spineIdx:8, spine:"I caught myself ordering tests because a textbook told me to.", body:"I caught myself one day ordering tests because a textbook told me to.\n\nNot because I had thought it through. Not because I had looked at the patient and the numbers and the story and come to a decision. Because the pathway said: next step, order this.\n\nAnd I was following the pathway like a checklist. Not like a physician.\n\nCaleb never worked from a checklist. He worked from understanding. He knew why every step existed and so he could adapt when the problem did not follow the script.\n\nI was not doing that. I was executing instructions I did not fully own.\n\nThat scared me more than the freezing did. Because at least when I froze I knew something was wrong. This felt like competence and it was not." },
  { date:"Tue Jul 14", act:"Defensive medicine", spineIdx:9, spine:"The system was outputting decent, well-behaved people practising defensive medicine.", body:"The system was outputting decent, well-behaved people practising defensive medicine.\n\nCareful. Cautious. Technically correct. Ordered the right tests. Followed the right protocols. Never too far from the guideline.\n\nAnd I understood why. When you have never had a sandbox, caution is the only tool you have. You do not trust your hands because your hands have never been tested. So you order more. You consult more. You hedge more.\n\nBut this is a human life.\n\nNot a board exam. Not a performance review. A person in a room who needs someone to think clearly and move with conviction.\n\nDefensive medicine keeps you safe. It does not always keep the patient safe.\n\nI did not want to be careful in the wrong way anymore." },
  { date:"Thu Jul 16", act:"The missing link", spineIdx:10, spine:"Medicine never had a sandbox.", body:"Medicine never had a sandbox.\n\nEvery other craft that produces mastery has one. Artists have sketchbooks. Musicians have practice rooms. Pilots have simulators. Athletes have training grounds where the consequence of a mistake is a lost rep, not a lost life.\n\nMedicine has textbooks and then a real patient.\n\nThat gap is not a gap in knowledge. It is a gap in reps. And you cannot close a reps gap by reading more. You close it by doing more. In a space where the doing is safe.\n\nThat room just was not there.\n\nAnd once I saw that clearly, I could not look away from it. Because the implications were enormous. Every doctor who ever froze at a bedside. Every hesitation that cost someone something. Traced back to the same missing thing.\n\nThe sandbox that nobody built." },
  { date:"Fri Jul 17", act:"Cannot ignore it", spineIdx:11, spine:"Once I saw that, I could not ignore it.", body:"Once I saw that, I could not ignore it.\n\nNot because I am particularly noble. But because I had lived on both sides of it. I knew what learning felt like when the feedback was real and immediate and safe. And I knew what it felt like when it was not.\n\nAnd the difference was not small. The difference was the difference between moving with conviction and moving with fear.\n\nMastery comes from doing. From failing and trying again, fast, in a space that can hold the failure. That is not a philosophy. That is just how humans learn things. It is how Caleb learned. It is how I learned to draw. It is how pilots learn to land.\n\nMedicine had decided it was exempt from that rule.\n\nIt is not." },
  { date:"Mon Jul 20", act:"Building the room", spineIdx:12, spine:"So I built the room.", body:"So I built the room.\n\nNot a question bank. Not a flashcard app. Not another way to memorize pathways.\n\nA room. With a patient in it. A real case, a real history, real numbers on a real monitor. And a clock that moves whether you are ready or not. Because in medicine the clock always moves.\n\nYou walk in. You talk to the patient. You order the labs. You read what comes back. You treat what you find. And an AI attending teaches you while you work, using the actual numbers in front of you.\n\nNot a textbook case. This case. This patient. This potassium of 6.2 at this moment in this presentation.\n\nAnd if you get it wrong, something happens. The pressure keeps falling. The rhythm changes. The physiology responds the way real physiology does.\n\nBecause consequences are the teacher. And this room can hold them." },
  { date:"Tue Jul 21", act:"What the room looks like", spineIdx:13, spine:"You do not choose a topic. You choose a patient.", body:"You do not choose a topic. You choose a patient.\n\nTom Hayes is in the resuscitation bay. Sarah Mensah is three days post-op and her numbers are moving in the wrong direction. An elderly man comes in with a sore throat that is not a sore throat.\n\nYou walk in. You work the case. Emergency, ICU, ward. Timed cases that move whether you are ready or not.\n\nAnd the library does not run out. Because that is the other thing about reps. You need volume. You need to see cardiomyopathy presenting as crackles enough times that your hands know before your mind catches up. You need to see the sore throat that is an airway closing. You need to have been in that room before the day it matters.\n\nThis is that room. Before the day it matters." },
  { date:"Thu Jul 23", act:"The attending", spineIdx:14, spine:"An AI attending teaches while you work, using the actual numbers in front of you.", body:"An AI attending teaches while you work, using the actual numbers in front of you.\n\nNot a textbook paragraph. Not a generic explanation of what pulmonary edema is. It reads this patient's vitals, this patient's results, what you have already ordered, and it teaches from there.\n\nWhy is she still hypotensive after fluids? It looks at the pressure that will not budge and walks you to the answer. The vessels are open. She needs tone, not more volume.\n\nIt remembers what you asked five minutes ago. It teaches the case in front of you, not a generic one.\n\nCaleb never taught me from a manual. He taught me from the problem we were both looking at. That is the difference. The teaching that sticks is always attached to something real." },
  { date:"Fri Jul 24", act:"Getting it wrong", spineIdx:15, spine:"Get it wrong and the patient gets worse. On purpose.", body:"Get it wrong and the patient gets worse. On purpose.\n\nIn most medical education, a wrong answer turns red and you move on. Nothing happens to anyone. The stakes are always zero.\n\nBut zero stakes produce zero learning at the level that matters.\n\nHere, something happens. Miss the bleed and the pressure keeps falling. Push the wrong drug and the rhythm changes. The physiology responds the way biology says it must.\n\nAnd you remember it. Not because someone told you it was wrong. Because you watched it cost something.\n\nThat is how Caleb taught me. Not by correcting my mistakes from a distance. By letting me see what the mistake produced. The joint that did not hold. The line that was not true. The consequence was the lesson.\n\nThe room that can hold your failures is the room where you actually learn." },
  { date:"Mon Jul 27", act:"Both audiences", spineIdx:16, spine:"A 13 year old and a physician can walk the same case. Both should learn something.", body:"A 13 year old and a physician can walk the same case. Both should learn something.\n\nThat is my test for whether the teaching is right.\n\nIf the only way to learn is to already have the vocabulary, it is not teaching. It is gatekeeping. And medicine has enough of that already.\n\nThe body is not a secret. It is a system. And any person willing to walk through a case and pay attention should be able to follow what is happening and why.\n\nThe AI attending reads the room. Sometimes you need one line. Sometimes the whole mechanism. You choose how deep to go. The teaching meets you where you are.\n\nThat is what Caleb did. He did not speak above me. He spoke to where my hands were. And he let the problem do most of the teaching." },
  { date:"Tue Jul 28", act:"The physiology decides", spineIdx:17, spine:"The AI explains. The physiology decides.", body:"The most important rule in the engine. The AI never decides whether the potassium rose.\n\nThe physiology decides. Vitals, electrolytes, the ECG stage, all follow explicit rules written into the case. Give the wrong treatment and the numbers move the way biology says they must. Not the way a language model thinks they should.\n\nThe AI's job is to explain, not to invent. It reads what the engine produced and teaches the mechanism behind it.\n\nThat line matters more than anything else in the build. It is the difference between a tutor you can trust and a tool that will confidently make something up.\n\nIn a sandbox for medicine, the medicine has to be real. The story can flex. The physiology cannot." },
  { date:"Thu Jul 30", act:"What I am documenting", spineIdx:18, spine:"I am documenting how I think, not just what I built.", body:"I am documenting how I think, not just what I built.\n\nAnyone can inherit a product. Few inherit the reasoning behind it. Why cases instead of flashcards. Why the physiology is fixed and the teaching is flexible. Why the patient is allowed to get worse.\n\nCaleb never just showed me the finished piece. He showed me why every decision was made. The joint, the angle, the grain of the wood. The thinking behind the hands.\n\nThat is what I want to pass on. Not the tool. The understanding of why the tool is built this way and not another way.\n\nBecause the next person who builds something like this should not have to start from zero. They should be able to start from here." },
  { date:"Fri Jul 31", act:"What the next doctor deserves", spineIdx:19, spine:"I trained to memorize. I am building so the next doctor does not have to.", body:"I trained to memorize. I am building so the next doctor does not have to.\n\nNot because memorization is worthless. But because it is not enough. It was never enough. And we have been pretending it was for long enough.\n\nThe next doctor deserves a sandbox. A room where they can freeze and recover and freeze again until they stop freezing. A master in the room while they work. Real feedback from a real case before a real life is on the line.\n\nThat room exists now.\n\nI grew up in two worlds that both knew how to make someone good at something. I spent years in a third world that did not.\n\nSo I built what was missing.\n\nYou understand the body. You do not memorize it." }
];

const statuses = {};

function g(id) { return document.getElementById(id); }

/* ── FONT SIZE ── */
function applyFontSize() {
  document.documentElement.style.setProperty("--fs-body", fontSize + "px");
  g("fs-val").textContent = fontSize;
  try { localStorage.setItem("arc-viz-fontSize", fontSize); } catch(e) {}
}
function changeFontSize(d) {
  fontSize = Math.max(12, Math.min(28, fontSize + d * 2));
  applyFontSize();
}

/* ── UMBRELLA ── */
function renderUmbrella() {
  const el = g("umbrella");
  const postRefsBySpine = spine.map(() => []);
  posts.forEach((p, i) => { if (p.spineIdx != null && p.spineIdx < spine.length) postRefsBySpine[p.spineIdx].push(i); });

  let html = "";
  for (let i = 0; i < spine.length; i++) {
    const isActive = postRefsBySpine[i].includes(current);
    const fadeClass = postRefsBySpine[i].length === 0 ? " faded" : "";
    const hlClass = isActive ? " highlight" : "";
    html += `<span class="spine-sentence${hlClass}${fadeClass}" data-si="${i}" onclick="goToSpine(${i})">${esc(spine[i])}</span>`;
    if (postRefsBySpine[i].length > 0) {
      html += `<span class="spine-post-refs">`;
      postRefsBySpine[i].forEach(pi => {
        const st = getStatus(pi);
        html += `<span class="spine-post-ref ${st}${pi===current?' active':''}" data-pi="${pi}" onclick="event.stopPropagation();goTo(${pi})" title="Post ${pi+1} · ${st}"></span>`;
      });
      html += `</span>`;
    }
    if (i < spine.length - 1) html += ` `;
  }
  el.innerHTML = html;
}

/* ── TIMELINE ── */
function renderTimeline() {
  const el = g("tl-body");
  let html = "";
  let lastAct = null;
  posts.forEach((p, i) => {
    if (p.act !== lastAct) {
      html += `<div class="tl-divider">${p.act}</div>`;
      lastAct = p.act;
    }
    const st = getStatus(i);
    const activeClass = i === current ? " active" : "";
    const takeCount = (speechTakes[i] && speechTakes[i].length) || 0;
    const countHtml = takeCount > 0 ? `<span class="tl-take-count">${takeCount}</span>` : "";
    html += `<div class="tl-row ${st}${activeClass}" onclick="goTo(${i})">
      <div class="tl-dot">${i + 1}</div>
      <div class="tl-info">
        <span class="tl-date">${p.date}</span>
        <span class="tl-act">${p.act}</span>
      </div>
      ${countHtml}
    </div>`;
  });
  el.innerHTML = html;
  // scroll active into view
  const activeRow = el.querySelector(".tl-row.active");
  if (activeRow) activeRow.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function renderActBand() {} // no-op, act labels inline now

/* ── READER ── */
function renderReader() {
  const p = posts[current];
  const st = getStatus(current);
  const badge = g("r-act");
  badge.textContent = p.act;
  badge.style.background = cAct(p);
  badge.style.color = dark ? actColors[p.act] : actTexts[p.act];
  
  if (p.spineIdx != null && p.spineIdx < spine.length) {
    g("r-spine-context").textContent = `Spine · sentence ${p.spineIdx + 1} of ${spine.length}`;
  } else {
    g("r-spine-context").textContent = "";
  }
  
  const selTake = getSelectedTake(current);
  const showToggle = !!selTake;
  g("read-toggle-bar").style.display = showToggle ? "" : "none";

  const isFused = !!(selTake && selTake.type === "fused");
  g("read-toggle-spoken").style.display = (showToggle && !isFused) ? "" : "none";
  g("read-toggle-fused").style.display = isFused ? "" : "none";
  g("fuse-btn").style.display = showToggle ? "" : "none";

  // clear all actives
  g("read-toggle-orig").classList.remove("active");
  g("read-toggle-spoken").classList.remove("active");
  g("read-toggle-fused").classList.remove("active");

  if (readMode === "spoken" && selTake) {
    g("r-body").textContent = selTake.transcript;
    (isFused ? g("read-toggle-fused") : g("read-toggle-spoken")).classList.add("active");
  } else {
    g("r-body").textContent = p.body;
    g("read-toggle-orig").classList.add("active");
  }
  
  g("post-num").textContent = `${current+1} of ${posts.length}`;
  g("prev-btn").disabled = current===0;
  g("next-btn").disabled = current===posts.length-1;
  g("reader").style.borderTop = `3px solid ${cAct(p)}`;

  g("status-group").innerHTML = ["draft","ready","posted"].map(s =>
    `<button class="status-btn ${st===s?"active-"+s:"s-"+s}" onclick="setStatus('${s}')">${s.charAt(0).toUpperCase()+s.slice(1)}</button>`
  ).join("");

  g("prev-btn").onclick = () => navigate(-1);
  g("next-btn").onclick = () => navigate(1);
}
function switchReadMode(mode) { readMode = mode; renderReader(); }

let readerEditing = false;
function toggleReaderEdit() {
  readerEditing = !readerEditing;
  const body = g("r-body");
  const area = g("reader-edit-area");
  const btn = g("reader-edit-btn");
  if (readerEditing) {
    // populate textarea from current body content
    g("reader-edit-textarea").value = body.textContent;
    body.classList.add("hidden");
    area.classList.add("active");
    btn.classList.add("editing");
  } else {
    body.classList.remove("hidden");
    area.classList.remove("active");
    btn.classList.remove("editing");
  }
}
function saveReaderEdit() {
  const text = g("reader-edit-textarea").value.trim();
  if (!text) return;
  const selTake = getSelectedTake(current);
  if (readMode === "spoken" && selTake) {
    selTake.transcript = text; saveTakesMeta();
  } else {
    posts[current].body = text;
  }
  readerEditing = false;
  g("r-body").classList.remove("hidden");
  g("reader-edit-area").classList.remove("active");
  g("reader-edit-btn").classList.remove("editing");
  renderReader();
}

/* ── DEEPSEEK LLM FUSION ── */
const DEEPSEEK_KEY = "sk-2fc4cc5ed6184f87be8837bc6ad7a3ff";
async function fuseWithLLM() {
  const selTake = getSelectedTake(current);
  if (!selTake) return;
  const original = posts[current].body;
  const spoken = selTake.transcript;
  if (!spoken || !original) return;

  // find the most recent fused take for iterative chaining
  const takes = speechTakes[current] || [];
  let previousFused = null;
  for (let i = takes.length - 1; i >= 0; i--) {
    if (takes[i].type === "fused" && takes[i].transcript) {
      previousFused = takes[i].transcript; break;
    }
  }
  const base = previousFused || original;

  const btn = g("fuse-btn");
  btn.disabled = true;
  btn.textContent = "Fusing…";
  btn.classList.add("fusing");

  try {
    const prevBlock = previousFused ? `PREVIOUS FUSED (last iteration):\n${previousFused}\n\n` : "";
    const r = await fetch("https://api.deepseek.com/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${DEEPSEEK_KEY}` },
      body: JSON.stringify({
        model: "deepseek-chat",
        max_tokens: 2000,
        temperature: 0.7,
        messages: [
          { role: "system", content: `You are a rewriting assistant in an iterative visual-arts–style refinement loop.

The user records themselves reading a text aloud, then you fuse their spoken voice with the written base.

This may be the first iteration or a later one. If a PREVIOUS FUSED version exists, BUILD ON IT — don't restart from scratch.
The ORIGINAL post is the anchor — every key idea, fact, and structural beat must be preserved across all iterations.
The SPOKEN TRANSCRIPT is the primary voice source — rewrite the text entirely in the user's natural voice, cadence, and phrasing as heard there.
The result should sound like the user thought it, said it, then tightened it — not like they memorized someone else's script.
Keep the same length and paragraph structure as the base.
Never add markdown, quotes, labels, or commentary. Return ONLY the fused post body.` },
          { role: "user", content: `ORIGINAL (anchor — all key ideas must survive):\n${original}\n\n${prevBlock}SPOKEN TRANSCRIPT (my read):\n${spoken}\n\nFUSED POST:` }
        ]
      })
    });
    if (!r.ok) { const err = await r.text(); throw new Error(err || `DeepSeek error ${r.status}`); }
    const data = await r.json();
    const fusedText = data.choices?.[0]?.message?.content?.trim();
    if (fusedText) {
      // create a NEW separate take entry for the fused result
      if (!speechTakes[current]) speechTakes[current] = [];
      const takeId = "f_" + current + "_" + Date.now();
      const selIdx = selectedTake[current];
      const fusedTake = {
        id: takeId,
        type: "fused",
        transcript: fusedText,
        fusedFrom: selIdx != null ? selIdx : null,
        duration: 0,
        timestamp: Date.now()
      };
      speechTakes[current].push(fusedTake);
      selectedTake[current] = speechTakes[current].length - 1;
      saveTakesMeta(); saveSelTake();
      readMode = "spoken";
    }
  } catch(e) {
    alert("Fusion failed: " + (e.message || e));
  }
  btn.disabled = false;
  btn.textContent = "✦ Fuse";
  btn.classList.remove("fusing");
  refresh();
}

/* ── NAVIGATION ── */
function goTo(i) { current = i; refresh(); }
function goToSpine(si) {
  const refs = posts.map((p,i) => p.spineIdx === si ? i : -1).filter(n => n >= 0);
  if (refs.length > 0) { current = refs[0]; refresh(); }
}
function navigate(d) { goTo(Math.max(0, Math.min(posts.length-1, current+d))); }

function refresh() {
  renderUmbrella();
  renderTimeline();
  renderActBand();
  renderReader();
  renderTakes();
}

/* ── DRAG ── */
(function initSpineDrag() {
  const panel = g("spine-panel");
  const handle = g("spine-handle");
  let dragging = false, startX, startY, origX, origY;
  function onStart(e) {
    dragging = true;
    const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX; startY = pt.clientY;
    const rect = panel.getBoundingClientRect();
    origX = rect.left; origY = rect.top;
    panel.style.transition = "none";
    e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    const pt = e.touches ? e.touches[0] : e;
    const dx = pt.clientX - startX, dy = pt.clientY - startY;
    let nx = origX + dx, ny = origY + dy;
    // keep in viewport
    const pw = panel.offsetWidth, ph = panel.offsetHeight;
    const vw = window.innerWidth, vh = window.innerHeight;
    nx = Math.max(0, Math.min(nx, vw - pw));
    ny = Math.max(0, Math.min(ny, vh - 40));
    spineX = nx; spineY = ny;
    panel.style.left = nx + "px"; panel.style.top = ny + "px"; panel.style.right = "auto";
  }
  function onEnd() {
    if (!dragging) return;
    dragging = false;
    panel.style.transition = "";
    savePositions();
  }
  handle.addEventListener("mousedown", onStart);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onEnd);
  handle.addEventListener("touchstart", onStart, {passive: false});
  window.addEventListener("touchmove", onMove, {passive: false});
  window.addEventListener("touchend", onEnd);
})();

// ── IndexedDB for audio blobs ──
const DB_NAME = "arc-viz-takes";
let idb = null;
function idbOpen() {
  return new Promise((resolve, reject) => {
    if (idb) return resolve(idb);
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      if (!e.target.result.objectStoreNames.contains("audio"))
        e.target.result.createObjectStore("audio", { keyPath: "id" });
    };
    req.onsuccess = (e) => { idb = e.target.result; resolve(idb); };
    req.onerror = () => reject(req.error);
  });
}
function idbSave(id, blob) {
  return idbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction("audio", "readwrite");
    tx.objectStore("audio").put({ id, blob });
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  }));
}
function idbLoad(id) {
  return idbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction("audio", "readonly");
    const req = tx.objectStore("audio").get(id);
    req.onsuccess = () => resolve(req.result?.blob || null);
    req.onerror = () => reject(req.error);
  }));
}
function idbDel(id) {
  return idbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction("audio", "readwrite");
    tx.objectStore("audio").delete(id);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  }));
}

// ── WAV conversion (webm blob → stereo 16-bit PCM WAV) ──
function webmToWav(blob) {
  return new Promise((resolve, reject) => {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const reader = new FileReader();
    reader.onload = () => {
      ctx.decodeAudioData(reader.result, (buffer) => {
        const numChannels = Math.min(buffer.numberOfChannels, 2);
        const sampleRate = buffer.sampleRate;
        const length = buffer.length;
        const bitsPerSample = 16;
        const bytesPerSample = bitsPerSample / 8;
        const blockAlign = numChannels * bytesPerSample;
        const dataSize = length * blockAlign;
        const fileSize = 44 + dataSize;

        const wav = new ArrayBuffer(fileSize);
        const view = new DataView(wav);

        // RIFF header
        writeString(view, 0, "RIFF");
        view.setUint32(4, fileSize - 8, true);
        writeString(view, 8, "WAVE");

        // fmt chunk
        writeString(view, 12, "fmt ");
        view.setUint32(16, 16, true);           // chunk size
        view.setUint16(20, 1, true);            // PCM
        view.setUint16(22, numChannels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * blockAlign, true); // byte rate
        view.setUint16(32, blockAlign, true);
        view.setUint16(34, bitsPerSample, true);

        // data chunk
        writeString(view, 36, "data");
        view.setUint32(40, dataSize, true);

        // interleave stereo PCM 16-bit
        const chData = [];
        for (let c = 0; c < numChannels; c++) chData.push(buffer.getChannelData(c));

        let offset = 44;
        for (let i = 0; i < length; i++) {
          for (let c = 0; c < numChannels; c++) {
            const sample = Math.max(-1, Math.min(1, chData[c][i]));
            const int16 = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
            view.setInt16(offset, int16, true);
            offset += 2;
          }
        }

        ctx.close();
        resolve(new Blob([wav], { type: "audio/wav" }));
      }, () => {
        ctx.close();
        resolve(null); // decode failed, return null
      });
    };
    reader.onerror = () => { ctx.close(); resolve(null); };
    reader.readAsArrayBuffer(blob);
  });
}
function writeString(view, offset, str) {
  for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
}

// ── Mic ──
function toggleMic() { if (micOn) stopMic(); else startMic(); }

async function startMic() {
  const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Ctor) { alert("Speech recognition needs Chrome or Edge."); return; }
  rec = new Ctor();
  rec.continuous = true; rec.interimResults = true; rec.lang = "en-US";
  liveBase = ""; liveInterim = "";
  recSegments = []; recSegStart = 0;
  const recStartPerf = performance.now();
  rec.onresult = (e) => {
    let interim = "", final = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    if (final) {
      const endMs = performance.now() - recStartPerf;
      recSegments.push({ text: final.trim(), startMs: recSegStart, endMs });
      recSegStart = endMs;
      liveBase += (liveBase ? " " : "") + final;
    }
    liveInterim = interim;
    g("speech-text").textContent = liveBase + (interim ? " " + interim : "") || "Listening…";
  };
  rec.onerror = () => stopMic();
  rec.onend = () => { if (micOn) { try { rec.start(); } catch(_) { stopMic(); } } };
  rec.start();

  // MediaRecorder for audio
  audioChunks = []; recStartTime = Date.now();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 2, echoCancellation: true, noiseSuppression: true }
    });
    const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "audio/webm";
    mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.addEventListener("stop", () => { stream.getTracks().forEach(t => t.stop()); }, { once: true });
    mediaRecorder.start();
  } catch(_) { mediaRecorder = null; }

  micOn = true;
  g("speech-bar").classList.add("recording");
  g("btn-mic").classList.add("recording");
  g("mic-idle").style.display = "none";
  g("mic-rec").style.display = "";
}

async function stopMic() {
  micOn = false;
  try { rec?.stop(); } catch(_) {}
  rec = null;

  // stop audio recorder, get blob
  let audioBlob = null;
  let duration = Math.round((Date.now() - recStartTime) / 1000);
  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    const mimeType = mediaRecorder.mimeType || "audio/webm";
    audioBlob = await new Promise(resolve => {
      mediaRecorder.addEventListener("stop", () => {
        resolve(new Blob(audioChunks, { type: mimeType }));
      }, { once: true });
      mediaRecorder.stop();
    });
  }
  mediaRecorder = null; audioChunks = [];

  // save take (or merge into re-record)
  const text = (liveBase || "").trim();
  const isReRecord = reRecordTakeIdx !== null;

  if (isReRecord) {
    // Merge new recording into the existing take at the re-record gap
    const takes = speechTakes[current], take = takes[reRecordTakeIdx];
    const newSegs = recSegments.length > 0 ? recSegments : [];
    const hasNewContent = text.length > 0 || newSegs.length > 0;
    let newRecBlob = null;
    if (audioBlob && audioBlob.size > 0) {
      try { newRecBlob = await webmToWav(audioBlob); } catch(_) {}
      if (!newRecBlob) newRecBlob = audioBlob;
    }

    let combinedSegs, combinedBlob = null;

    if (hasNewContent) {
      // Full re-record: pre + new + shifted-post
      const newRecDurMs = newSegs.length > 0 ? newSegs[newSegs.length - 1].endMs : duration * 1000;
      const timedNewSegs = newSegs.map(s => ({
        text: s.text,
        startMs: s.startMs + reRecordInsertMs,
        endMs: s.endMs + reRecordInsertMs
      }));
      const shiftedPost = reRecordPostSegs.map(s => ({
        ...s,
        startMs: s.startMs + newRecDurMs,
        endMs: s.endMs + newRecDurMs
      }));
      combinedSegs = [...reRecordPreSegs.map(s => ({ ...s })), ...timedNewSegs, ...shiftedPost];
      try {
        combinedBlob = await rebuildCombinedAudio(
          take.originalId || take.id, reRecordPreSegs, newRecBlob, reRecordPostSegs
        );
      } catch(e) { console.error("Audio rebuild failed:", e); }
    } else {
      // Empty re-record = pure snip: pre + post only
      combinedSegs = [...reRecordPreSegs.map(s => ({ ...s })), ...reRecordPostSegs.map(s => ({ ...s }))];
      try {
        combinedBlob = await rebuildAudioFromSegments(take, combinedSegs);
      } catch(e) { console.error("Snip rebuild failed:", e); }
    }

    if (combinedBlob) {
      const newId = "t_" + current + "_edit_" + Date.now();
      take.id = newId;
      take.segments = combinedSegs;
      take.transcript = combinedSegs.map(s => s.text).join(" ");
      const lastSeg = combinedSegs[combinedSegs.length - 1];
      take.duration = Math.round(lastSeg.endMs / 1000);
      await idbSave(newId, combinedBlob);
      selectedTake[current] = reRecordTakeIdx;
      saveTakesMeta(); saveSelTake();
      if (readMode === "original") readMode = "spoken";
    }

    reRecordPreSegs = []; reRecordPostSegs = [];
    reRecordTakeIdx = null; reRecordInsertMs = 0;
  } else if (text || audioBlob) {
    if (!speechTakes[current]) speechTakes[current] = [];
    const takeId = "t_" + current + "_" + Date.now();
    const segments = recSegments.length > 0 ? recSegments : [{ text, startMs: 0, endMs: duration * 1000 }];
    const take = { id: takeId, type: "raw", transcript: text, duration, timestamp: Date.now(), segments, originalId: takeId };
    speechTakes[current].push(take);
    if (audioBlob && audioBlob.size > 0) {
      try {
        const wav = await webmToWav(audioBlob);
        if (wav) await idbSave(takeId, wav);
        else await idbSave(takeId, audioBlob); // fallback to webm blob
      } catch(_) { try { await idbSave(takeId, audioBlob); } catch(__) {} }
    }
    selectedTake[current] = speechTakes[current].length - 1;
    saveTakesMeta(); saveSelTake();
    if (readMode === "original") readMode = "spoken";
    takesOpen = true; takesMinimized = false; // auto-show panel after recording, expanded
  }

  liveBase = ""; liveInterim = "";
  g("speech-bar").classList.remove("recording");
  g("btn-mic").classList.remove("recording");
  g("mic-idle").style.display = "";
  g("mic-rec").style.display = "none";
  refresh();
}

// ── Takes panel ──
function renderTakes() {
